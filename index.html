<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lera's Workouts</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Workouts">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<style>
  :root {
    color-scheme: light;
    --bg: #f2f2f7;
    --card: #ffffff;
    --field: #f2f2f7;
    --text: #111114;
    --text-2: #55555b;
    --muted: #8a8a90;
    --line: #e2e2e7;
    --grid: #ebebf0;
    --accent: #4a3aa7;
    --accent-soft: #ebe8fb;
    --on-accent: #ffffff;
    --danger: #c9302c;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
    --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #000000;
      --card: #1c1c1e;
      --field: #2c2c2e;
      --text: #ffffff;
      --text-2: #c3c2c8;
      --muted: #8e8e93;
      --line: #2e2e31;
      --grid: #2a2a2d;
      --accent: #9085e9;
      --accent-soft: #29244d;
      --on-accent: #14112b;
      --danger: #ff6961;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
      --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #000000;
    --card: #1c1c1e;
    --field: #2c2c2e;
    --text: #ffffff;
    --text-2: #c3c2c8;
    --muted: #8e8e93;
    --line: #2e2e31;
    --grid: #2a2a2d;
    --accent: #9085e9;
    --accent-soft: #29244d;
    --on-accent: #14112b;
    --danger: #ff6961;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  #app {
    max-width: 560px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 32px);
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; }

  h1 { font-size: 34px; line-height: 1.15; margin: 8px 0 2px; letter-spacing: -0.02em; }
  h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 24px 4px 8px; }
  .sub { color: var(--text-2); margin: 0 0 8px; }

  .card { background: var(--card); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }

  /* Cycle */
  .weeks { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 10px; }
  .week {
    border-radius: 10px; padding: 8px 2px; text-align: center; background: var(--field);
    font-size: 12px; color: var(--text-2); min-height: 52px;
  }
  .week b { display: block; font-size: 15px; color: var(--text); }
  .week.current { outline: 2px solid var(--accent); outline-offset: -2px; }
  .week.done { background: var(--accent-soft); }
  .week.done b::after { content: " ✓"; color: var(--accent); }

  /* Exercise list */
  .ex-head { display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: inherit; margin-bottom: 4px; }
  .ex-name { font-size: 19px; font-weight: 600; }
  .chev { color: var(--muted); font-size: 22px; line-height: 1; }
  .line { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .line:first-of-type { border-top: 0; }
  .tag { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; color: var(--accent); width: 34px; flex: none; }
  .cfg { font-variant-numeric: tabular-nums; }
  .count { font-variant-numeric: tabular-nums; color: var(--text-2); font-size: 14px; white-space: nowrap; }

  .check {
    width: 32px; height: 32px; border-radius: 50%; flex: none;
    border: 2px solid var(--muted); display: grid; place-items: center;
  }
  .check svg { width: 18px; height: 18px; opacity: 0; }
  .check[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
  .check[aria-pressed="true"] svg { opacity: 1; stroke: var(--on-accent); }

  /* Buttons */
  .btn {
    display: block; width: 100%; padding: 13px; border-radius: 12px; text-align: center;
    background: var(--card); color: var(--accent); font-weight: 600; margin-bottom: 8px;
  }
  .btn.danger { color: var(--danger); }
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  /* Detail */
  .topbar { display: flex; align-items: center; height: 40px; }
  .back { text-decoration: none; color: var(--accent); font-size: 17px; display: flex; align-items: center; gap: 2px; margin-left: -6px; padding: 6px; }
  .back span { font-size: 26px; line-height: 1; margin-top: -3px; }

  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--field); border-radius: 10px; padding: 2px; }
  .card .seg { background: var(--field); }
  .seg button { padding: 8px 6px; border-radius: 8px; font-size: 14px; font-weight: 500; color: var(--text-2); }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgb(0 0 0 / 0.15); font-weight: 600; }
  .tabs { margin: 12px 0 4px; background: rgb(118 118 128 / 0.14); }
  .tabs button { font-size: 15px; padding: 9px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-left: 6px; vertical-align: middle; }

  .done-btn {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 14px; border-radius: 12px; font-size: 17px; font-weight: 600;
    background: var(--accent-soft); color: var(--accent);
  }
  .done-btn[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .done-btn svg { width: 20px; height: 20px; stroke: currentColor; }

  .times { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
  .times-num { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 2ch; text-align: center; }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .step { width: 38px; height: 38px; border-radius: 50%; background: var(--field); font-size: 22px; line-height: 1; color: var(--accent); }

  .feel { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 8px; }
  .feel button { padding: 10px 0; border-radius: 10px; background: var(--field); font-weight: 600; font-size: 17px; }
  .feel button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .feel-scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 4px; }

  .field { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .field:first-child { border-top: 0; padding-top: 2px; }
  .field label { flex: 1; color: var(--text-2); }
  .field input[type="text"], .field input:not([type]) {
    width: 96px; text-align: right; border: 0; background: var(--field); border-radius: 8px; padding: 8px 10px;
    font-variant-numeric: tabular-nums; font-size: 17px;
  }
  .field input.wide { width: 150px; }
  .field .seg { width: 104px; flex: none; }
  .field .seg button { padding: 6px 0; }
  textarea {
    width: 100%; min-height: 76px; border: 0; background: var(--field); border-radius: 10px; padding: 10px;
    resize: vertical; font-size: 16px;
  }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; }

  /* Chart */
  .chart-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .chart-head .seg { width: 100%; }
  .chart-head .seg button { padding: 5px 0; font-size: 13px; }
  .chart { position: relative; height: 200px; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  .chart svg { display: block; overflow: visible; }
  .chart .empty { height: 100%; display: grid; place-items: center; text-align: center; color: var(--muted); font-size: 14px; margin: 0; padding: 0 20px; }
  .axis { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .tip {
    position: absolute; top: 0; pointer-events: none; background: var(--text); color: var(--card);
    font-size: 12px; line-height: 1.35; padding: 6px 9px; border-radius: 8px; white-space: nowrap;
    transform: translateX(-50%); display: none; z-index: 2;
  }
  .tip b { font-size: 14px; }

  .vol-range { margin-bottom: 10px; }
  .vol-range button { padding: 6px 0; font-size: 13px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--text-2); margin-top: 8px; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .tip .sw { margin-right: 4px; }

  .hist { margin-top: 10px; }
  .hist-row { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 15px; font-variant-numeric: tabular-nums; }
  .hist-row .d { width: 64px; color: var(--text-2); flex: none; }
  .hist-row .x { color: var(--muted); font-size: 20px; padding: 0 6px; line-height: 1; }
  details summary { cursor: pointer; color: var(--accent); font-weight: 600; padding: 4px 0; list-style: none; }
  details summary::-webkit-details-marker { display: none; }

  /* Start page */
  .pick { padding: 18px 16px; margin-bottom: 12px; }

  /* Day navigation (same layout as the knee page) */
  .datenav { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 4px; }
  .datenav > button { width: 44px; height: 44px; border-radius: 50%; font-size: 22px; background: var(--card); color: var(--accent); }
  .datenav > button:disabled { opacity: .3; }
  .datenav .label { width: auto; height: auto; background: none; color: var(--text); text-align: center; padding: 2px 10px; border-radius: 12px; font-size: 16px; }
  .datenav .label strong { display: block; font-size: 20px; }
  .datenav .label strong::after { content: ' ▾'; font-size: 13px; color: var(--muted); }

  /* Calendar sheet */
  .cal-backdrop { position: fixed; inset: 0; background: rgb(0 0 0 / .4); z-index: 10; }
  .cal-sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-width: 560px; margin: 0 auto; background: var(--card); border-radius: 20px 20px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cal-head button { width: 40px; height: 40px; border-radius: 50%; font-size: 22px; background: var(--field); color: var(--accent); }
  .cal-head button:disabled { opacity: .3; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 12px; }
  .cal-grid .wd { text-align: center; font-size: 12px; color: var(--muted); padding: 4px 0; }
  .cal-grid button { position: relative; aspect-ratio: 1; border-radius: 50%; font-size: 15px; font-variant-numeric: tabular-nums; }
  .cal-grid button:disabled { color: var(--muted); opacity: .4; }
  .cal-grid button.today { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .cal-grid button.sel { background: var(--accent); color: var(--on-accent); font-weight: 700; }
  .cal-grid button i { position: absolute; left: 50%; bottom: 12%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--accent); }
  .cal-grid button.sel i { background: var(--on-accent); }
  .cal-sheet .btn { background: var(--field); margin: 0; }

  /* Bottom tabs (Today / Progress), as on the knee page */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  .tabbar .inner { display: flex; width: 100%; max-width: 560px; }
  .tabbar a { flex: 1; padding: 10px 0 12px; text-align: center; text-decoration: none; color: var(--muted); font-size: 12px; font-weight: 600; }
  .tabbar a svg { display: block; margin: 0 auto 3px; width: 24px; height: 24px; }
  .tabbar a.on { color: var(--accent); }
  body.has-tabbar #app { padding-bottom: calc(env(safe-area-inset-bottom) + 90px); }

  /* Progress */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 4px; }
  .stat { background: var(--card); border-radius: 14px; padding: 12px; }
  .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); }
  .log-item { display: block; width: 100%; text-align: left; padding: 11px 0; border-top: 1px solid var(--line); }
  .log-item:first-child { border-top: 0; padding-top: 2px; }
  .log-item .small { margin-top: 2px; }

  .switch { position: relative; width: 51px; height: 31px; flex: none; }
  .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; z-index: 1; }
  .switch span { position: absolute; inset: 0; border-radius: 31px; background: var(--line); transition: background .2s; }
  .switch span::after { content: ""; position: absolute; left: 2px; top: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgb(0 0 0 / .2); transition: transform .2s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(20px); }
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<div id="cal" hidden>
  <div class="cal-backdrop" data-cal="close"></div>
  <div class="cal-sheet">
    <div class="cal-head">
      <button data-cal="prev" aria-label="Previous month">‹</button>
      <strong id="calTitle"></strong>
      <button data-cal="next" id="calNext" aria-label="Next month">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <button class="btn" data-cal="today">Go to today</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  const KEY = 'lera-workouts-v1';
  const KINDS = {
    iso: { label: 'Isometric', tag: 'ISO', amount: 'secs', amountLabel: 'Hold time (s)', metricLabel: 'Time', fmt: v => `${fmtNum(v)}s` },
    dyn: { label: 'Dynamic', tag: 'DYN', amount: 'reps', amountLabel: 'Reps', metricLabel: 'Reps', fmt: v => `${fmtNum(v)} reps` },
  };
  // Rep-equivalents for the reps chart: one rep ≈ 3 s under tension at a normal tempo,
  // so an isometric hold counts as secs / 3 reps. Guitar uses its own minutes-per-rep setting.
  const SECS_PER_REP = 3;
  const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  // ---------- helpers ----------
  const pad = n => String(n).padStart(2, '0');
  const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const dateOf = s => new Date(s + 'T00:00:00');
  const fmtDate = s => dateOf(s).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
  const fmtNum = n => n == null || n === '' ? '–' : String(Math.round(n * 100) / 100);
  const parseNum = v => { const n = parseFloat(String(v).replace(',', '.')); return Number.isFinite(n) ? n : null; };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Math.random().toString(36).slice(2, 10);
  const toUnit = (w, from, to) => from === to ? w : from === 'kg' ? w * 2.20462 : w / 2.20462;
  const setsText = (k, r) => `${fmtNum(r.sets)} × ${k.fmt(r[k.amount])}`;
  const feelWord = f => ['', 'Easy', 'Fairly easy', 'OK', 'Tough', 'Hard'][f] || '';

  // ---------- data ----------
  function section(weight, unit, amount, kind, setting, aims, timesDone, feel, lastDate) {
    const amt = KINDS[kind].amount;
    const s = { weight, unit, sets: 2, [amt]: amount, setting, aims, timesDone, feel, history: [] };
    if (lastDate) s.history.push({ date: lastDate, weight, unit, sets: 2, [amt]: amount, feel, setting });
    return s;
  }

  function seed() {
    return {
      version: 1,
      cycle: [
        { focus: 'Dynamic', done: true },
        { focus: 'ISO', done: false },
        { focus: 'Dynamic', done: false },
        { focus: 'ISO', done: false },
        { focus: 'Deload', done: false },
      ],
      exercises: [
        {
          id: uid(), name: 'Pull ups', assisted: true,
          iso: section(36, 'kg', 30, 'iso', '', 'Aim: 7kg assist', 4, 5, '2026-09-14'),
          dyn: section(40, 'kg', 5, 'dyn', '', 'Aim: 15kg assist', 0, null),
        },
        {
          id: uid(), name: 'Seated row', assisted: false,
          iso: section(60, 'lbs', 30, 'iso', 'IN', 'Aim: 90lbs', 1, 5, '2026-09-30'),
          dyn: section(50, 'lbs', 5, 'dyn', 'OUT', 'Aim: 90lbs\nAim for a fit woman: 115lbs', 0, null),
        },
        {
          id: uid(), name: 'Shoulder press', assisted: false,
          iso: section(14, 'kg', 30, 'iso', 'OUT', 'Aim: 22kg', 4, 5, '2026-09-14'),
          dyn: section(14, 'kg', 5, 'dyn', 'OUT', 'Aim: 18kg\nAim for a fit woman: 22kg', 0, null),
        },
        {
          id: uid(), name: 'Chest press machine', assisted: false,
          iso: section(23, 'kg', 30, 'iso', 'Plugged in', 'Aim: 40kg', 1, 5, '2026-09-30'),
          dyn: section(18, 'kg', 5, 'dyn', 'OUT', 'Aim: 28kg\nAim for a fit woman: 38kg', 0, null),
        },
      ],
    };
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) { const d = JSON.parse(raw); if (d && Array.isArray(d.exercises)) return migrate(d); }
    } catch (e) { /* fall through to seed */ }
    return migrate(seed());
  }
  // Older data had no sets; her routine is 2 sets of each.
  function migrate(d) {
    for (const ex of d.exercises) for (const kind of ['iso', 'dyn']) {
      const sec = ex[kind];
      if (sec.sets == null) sec.sets = 2;
      for (const h of sec.history) if (h.sets == null) h.sets = 2;
      sec.history.sort((a, b) => a.date.localeCompare(b.date)); // times-done runs rely on date order
    }
    // Guitar is logged in minutes and scored at a fixed 50 points per 30 min.
    if (!d.guitar) d.guitar = { minutes: 30, history: [] };
    return d;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable */ }
  }

  let state = load();
  save();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  // ui.day is the day being logged on the Arms page (today unless picked otherwise)
  const ui = { tab: 'iso', metric: { iso: 'weight', dyn: 'weight' }, range: 30, day: todayStr() };
  try { const r = localStorage.getItem(KEY + '.range'); if (r !== null) ui.range = Number(r); } catch (e) { /* default range */ }

  // ---------- domain logic ----------
  const findEx = id => state.exercises.find(e => e.id === id);
  const dayEntry = sec => sec.history.find(h => h.date === ui.day);

  function toggleDone(ex, kind) {
    const sec = ex[kind], amt = KINDS[kind].amount, t = ui.day;
    const i = sec.history.findIndex(h => h.date === t);
    if (i >= 0) {
      sec.history.splice(i, 1);
    } else {
      sec.history.push({ date: t, weight: sec.weight, unit: sec.unit, sets: sec.sets, [amt]: sec[amt], feel: sec.feel, setting: sec.setting });
      sec.history.sort((a, b) => a.date.localeCompare(b.date));
    }
  }

  // Weight, unit, sets, reps/time and machine setting make up a "configuration".
  const cfgKey = (kind, r) => [r.weight, r.unit, r.sets, r[KINDS[kind].amount], (r.setting || '').trim().toUpperCase()].join('|');
  // Setup shown for the selected day: what was logged that day, otherwise the current setup.
  const shownCfg = (ex, kind) => dayEntry(ex[kind]) || ex[kind];
  // Times done = sessions in a row with the same configuration, up to the selected day.
  // On a day not ticked yet it's the run so far, if the last session matches the current setup.
  function timesOn(ex, kind) {
    const sec = ex[kind], hist = sec.history.filter(h => h.date <= ui.day);
    if (!hist.length) return 0;
    const last = hist[hist.length - 1];
    const key = cfgKey(kind, last.date === ui.day ? last : sec);
    let n = 0;
    for (let i = hist.length - 1; i >= 0 && cfgKey(kind, hist[i]) === key; i--) n++;
    return n;
  }

  // Changing the setup also updates the selected day's session if it's ticked;
  // the times-done count follows from the history (see timesOn).
  function setConfig(ex, kind, field, value) {
    const sec = ex[kind], amt = KINDS[kind].amount;
    if (sec[field] === value) return;
    sec[field] = value;
    const t = dayEntry(sec);
    if (t) Object.assign(t, { weight: sec.weight, unit: sec.unit, sets: sec.sets, [amt]: sec[amt], setting: sec.setting });
  }

  const guitarDay = () => state.guitar.history.find(h => h.date === ui.day);
  // ---------- load & points ----------
  // Load = weight actually moved × sets × reps (holds: 1 rep per SECS_PER_REP s).
  // Points = load ÷ the first logged session of that exercise and type × 100,
  // so each exercise is compared with its own start and can be stacked fairly.
  const toKg = (w, unit) => unit === 'lbs' ? w / 2.20462 : w;
  function liftedKg(ex, h) {
    if (h.weight == null) return null;
    const w = toKg(h.weight, h.unit);
    if (!ex.assisted) return w;
    return state.bodyKg ? Math.max(0, state.bodyKg - w) : null; // assisted: body weight minus the assist
  }
  const repsOf = (kind, h) => kind === 'iso' ? (h.secs || 0) / SECS_PER_REP : (h.reps || 0);
  const loadOf = (ex, kind, h) => { const w = liftedKg(ex, h); return w == null ? null : w * (h.sets || 0) * repsOf(kind, h); };
  const estMax = (ex, kind, h) => { const w = liftedKg(ex, h); return w == null ? null : w * (1 + repsOf(kind, h) / 30); }; // Epley
  function baselineLoad(ex, kind) {
    for (const h of ex[kind].history) { const l = loadOf(ex, kind, h); if (l) return l; }
    return null;
  }
  // Without a usable load (no weight, or assisted with no body weight) a session counts as 100
  const scoreOf = (ex, kind, h) => { const l = loadOf(ex, kind, h), b = baselineLoad(ex, kind); return l != null && b ? l / b * 100 : 100; };
  const GUITAR_PTS_PER_30 = 50;
  const guitarPts = mins => Math.round(mins / 30 * GUITAR_PTS_PER_30);
  function toggleGuitar() {
    const g = state.guitar, t = ui.day;
    if (guitarDay()) g.history = g.history.filter(h => h.date !== t);
    else { g.history.push({ date: t, minutes: g.minutes }); g.history.sort((a, b) => a.date.localeCompare(b.date)); }
  }

  function setFeel(ex, kind, v) {
    const sec = ex[kind];
    sec.feel = sec.feel === v ? null : v;
    const t = dayEntry(sec);
    if (t) t.feel = sec.feel;
  }

    if (sec.setting) parts.push(esc(sec.setting));
    return parts.join(' · ');
  }

  // ---------- chart ----------
  function niceTicks(lo, hi, n) {
    if (lo === hi) { const p = Math.max(1, Math.abs(lo) * 0.1); lo -= p; hi += p; }
    const raw = (hi - lo) / n, mag = 10 ** Math.floor(Math.log10(raw)), r = raw / mag;
    const step = (r < 1.5 ? 1 : r < 3 ? 2 : r < 7 ? 5 : 10) * mag;
    const start = Math.floor(lo / step) * step, end = Math.ceil(hi / step) * step;
    const ticks = [];
    for (let v = start; v <= end + step / 2; v += step) ticks.push(Math.round(v * 1e6) / 1e6);
    return ticks;
  }

  function drawChart(el, ex, kind) {
    const sec = ex[kind], k = KINDS[kind], metric = ui.metric[kind];
    const pts = sec.history.map(h => ({
      h, t: dateOf(h.date).getTime(),
      y: metric === 'weight' ? toUnit(h.weight, h.unit, sec.unit)
        : metric === 'volume' ? loadOf(ex, kind, h)
        : metric === 'max' ? estMax(ex, kind, h)
        : h[k.amount],
    })).filter(p => p.y != null);

    if (!pts.length && ex.assisted && !state.bodyKg && (metric === 'volume' || metric === 'max')) {
      el.innerHTML = `<p class="empty">Add your body weight under Arms → Progress → Settings to see this for an assisted exercise.</p>`;
      return;
    }
    if (!pts.length) {
      el.innerHTML = `<p class="empty">Tick “Mark done today” after a session and your progress will appear here.</p>`;
      return;
    }

    const W = el.clientWidth, H = el.clientHeight;
    const m = { l: 34, r: 14, t: 34, b: 22 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b;
    const ys = pts.map(p => p.y);
    const ticks = niceTicks(Math.min(...ys), Math.max(...ys), 4);
    const y0 = ticks[0], y1 = ticks[ticks.length - 1];
    const t0 = pts[0].t, t1 = pts[pts.length - 1].t;
    const sx = t => m.l + (t1 === t0 ? iw / 2 : (t - t0) / (t1 - t0) * iw);
    const sy = v => m.t + ih - (v - y0) / (y1 - y0) * ih;

    const grid = ticks.map(v => `
      <line x1="${m.l}" x2="${W - m.r}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--grid)" stroke-width="1"/>
      <text class="axis" x="${m.l - 6}" y="${sy(v) + 4}" text-anchor="end">${fmtNum(v)}</text>`).join('');

    const xl = [pts[0]];
    if (pts.length > 1) xl.push(pts[pts.length - 1]);
    const xLabels = xl.map((p, i) => `<text class="axis" x="${sx(p.t)}" y="${H - 4}" text-anchor="${pts.length === 1 ? 'middle' : i === 0 ? 'start' : 'end'}">${fmtDate(p.h.date)}</text>`).join('');

    const path = pts.map((p, i) => `${i ? 'L' : 'M'}${sx(p.t).toFixed(1)},${sy(p.y).toFixed(1)}`).join('');
    const dots = pts.map(p => `<circle cx="${sx(p.t)}" cy="${sy(p.y)}" r="4" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>`).join('');

    el.innerHTML = `
      <svg width="${W}" height="${H}" role="img" aria-label="${esc(ex.name)} ${k.label} ${metric === 'weight' ? 'weight' : k.metricLabel} over time">
        ${grid}${xLabels}
        <line id="cross" y1="${m.t}" y2="${m.t + ih}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>
        <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        ${dots}
        <circle id="hot" r="6" fill="var(--accent)" stroke="var(--card)" stroke-width="2" visibility="hidden"/>
      </svg>
      <div class="tip" id="tip"></div>`;

    const svg = el.querySelector('svg'), tip = el.querySelector('#tip');
    const cross = el.querySelector('#cross'), hot = el.querySelector('#hot');

    function show(clientX) {
      const x = clientX - svg.getBoundingClientRect().left;
      let best = pts[0];
      for (const p of pts) if (Math.abs(sx(p.t) - x) < Math.abs(sx(best.t) - x)) best = p;
      const px = sx(best.t), py = sy(best.y), h = best.h;
      cross.setAttribute('x1', px); cross.setAttribute('x2', px); cross.setAttribute('visibility', 'visible');
      hot.setAttribute('cx', px); hot.setAttribute('cy', py); hot.setAttribute('visibility', 'visible');
      const val = metric === 'volume' ? `<br>Volume <b>${Math.round(best.y)}</b>` : metric === 'max' ? `<br>Est. max <b>${fmtNum(Math.round(best.y * 10) / 10)} kg</b>` : '';
      tip.innerHTML = `${fmtDate(h.date)}<br><b>${fmtNum(h.weight)} ${h.unit}</b> · ${setsText(k, h)}${val}${h.feel ? `<br>Feel ${h.feel} · ${feelWord(h.feel)}` : ''}`;
      tip.style.display = 'block';
      const half = tip.offsetWidth / 2;
      tip.style.left = Math.min(Math.max(px, half), W - half) + 'px';
    }
    function hide() {
      cross.setAttribute('visibility', 'hidden'); hot.setAttribute('visibility', 'hidden'); tip.style.display = 'none';
    }
    svg.addEventListener('pointerdown', e => show(e.clientX));
    svg.addEventListener('pointermove', e => show(e.clientX));
    svg.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hide(); });
    hideTip = hide;
  }

  // Stacked bars of rep-equivalents per day, one colour per exercise (guitar always last, slot 8).
  const exColor = i => `var(--s${i % 7 + 1})`;
  function daySegs(date) {
    const segs = [];
    state.exercises.forEach((ex, i) => {
      const iso = ex.iso.history.find(h => h.date === date), dyn = ex.dyn.history.find(h => h.date === date);
      if (!iso && !dyn) return;
      const pts = (iso ? scoreOf(ex, 'iso', iso) : 0) + (dyn ? scoreOf(ex, 'dyn', dyn) : 0);
      const w = h => h.weight == null ? '' : `${fmtNum(h.weight)} ${h.unit}${ex.assisted ? ' assist' : ''} `;
      const parts = [iso && `ISO ${w(iso)}${fmtNum(iso.sets)}×${fmtNum(iso.secs)}s`, dyn && `DYN ${w(dyn)}${fmtNum(dyn.sets)}×${fmtNum(dyn.reps)}`].filter(Boolean);
      segs.push({ name: ex.name, color: exColor(i), pts, detail: parts.join(' + ') });
    });
    const g = state.guitar.history.find(h => h.date === date);
    if (g && g.minutes) segs.push({ name: 'Guitar', color: 'var(--s8)', pts: guitarPts(g.minutes), detail: `${fmtNum(g.minutes)} min` });
    return segs;
  }
  const armDates = () => [...new Set(state.exercises.flatMap(ex => [...ex.iso.history, ...ex.dyn.history])
    .concat(state.guitar.history).map(h => h.date))];
  function volumeDays() {
    const t = todayStr();
    let start = ui.range ? shiftDay(t, -(ui.range - 1)) : null;
    if (!start) {
      const first = armDates().sort()[0];
      start = first && first < shiftDay(t, -6) ? first : shiftDay(t, -6);
    }
    const days = [];
    for (let d = start; d <= t; d = shiftDay(d, 1)) days.push(d);
    return days.map(date => {
      const segs = daySegs(date).filter(sg => sg.pts > 0);
      return { date, segs, total: segs.reduce((a, x) => a + x.pts, 0) };
    });
  }

  function drawVolume(el) {
    const days = volumeDays();
    const series = [...state.exercises.map((ex, i) => ({ name: ex.name, color: exColor(i) })), { name: 'Guitar', color: 'var(--s8)' }]
      .filter(x => days.some(d => d.segs.some(sg => sg.name === x.name)));
    document.getElementById('volLegend').innerHTML = series.map(x => `<span><span class="sw" style="background:${x.color}"></span>${esc(x.name)}</span>`).join('');
    if (!series.length) {
      el.innerHTML = `<p class="empty">Nothing logged in this period yet. Ticked exercises and guitar show up here.</p>`;
      return;
    }
    const W = el.clientWidth, H = el.clientHeight;
    const m = { l: 34, r: 8, t: 10, b: 22 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b, n = days.length;
    const ticks = niceTicks(0, Math.max(1, ...days.map(d => d.total)), 4).filter(v => v >= 0);
    const top = ticks[ticks.length - 1];
    const sy = v => m.t + ih - v / top * ih;
    const bw = Math.max(3, Math.min(18, iw / n - 3));
    const sx = i => m.l + bw / 2 + (n === 1 ? (iw - bw) / 2 : i * (iw - bw) / (n - 1));
    const grid = ticks.map(v => `
      <line x1="${m.l}" x2="${W - m.r}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--grid)" stroke-width="1"/>
      <text class="axis" x="${m.l - 6}" y="${sy(v) + 4}" text-anchor="end">${fmtNum(v)}</text>`).join('');
    const xi = [...new Set([0, Math.floor((n - 1) / 2), n - 1])];
    const xLabels = xi.map((i, k) => `<text class="axis" x="${sx(i)}" y="${H - 4}" text-anchor="${n === 1 ? 'middle' : k === 0 ? 'start' : k === xi.length - 1 ? 'end' : 'middle'}">${fmtDate(days[i].date)}</text>`).join('');
    // flat on the baseline, 2px gap between stacked segments, only the top segment rounded
    const bars = days.map((d, i) => {
      let acc = 0;
      return d.segs.map((sg, k) => {
        const y0 = sy(acc), y1 = sy(acc + sg.pts);
        acc += sg.pts;
        const h = Math.max(1, y0 - y1 - (k ? 2 : 0)), x = sx(i) - bw / 2;
        if (k < d.segs.length - 1) return `<rect x="${x.toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${sg.color}"/>`;
        const r = Math.min(3, bw / 2, h);
        return `<path d="M${x} ${y1 + h}V${y1 + r}Q${x} ${y1} ${x + r} ${y1}H${x + bw - r}Q${x + bw} ${y1} ${x + bw} ${y1 + r}V${y1 + h}Z" fill="${sg.color}"/>`;
      }).join('');
    }).join('');

    el.innerHTML = `
      <svg width="${W}" height="${H}" role="img" aria-label="Points per day, stacked by exercise">
        ${grid}${xLabels}
        <rect id="vhot" y="${m.t}" height="${ih}" fill="var(--text)" opacity=".06" visibility="hidden"/>
        ${bars}
      </svg>
      <div class="tip" id="vtip" style="white-space:normal;width:max-content;max-width:${W}px"></div>`;

    const svg = el.querySelector('svg'), tip = el.querySelector('#vtip'), hot = el.querySelector('#vhot');
    function show(clientX) {
      const x = clientX - svg.getBoundingClientRect().left;
      const i = Math.max(0, Math.min(n - 1, n === 1 ? 0 : Math.round((x - m.l - bw / 2) / ((iw - bw) / (n - 1)))));
      const d = days[i], px = sx(i);
      hot.setAttribute('x', px - bw / 2 - 3); hot.setAttribute('width', bw + 6); hot.setAttribute('visibility', 'visible');
      tip.innerHTML = `${fmtDate(d.date)}` + (d.segs.length
        ? d.segs.slice().reverse().map(sg => `<br><span class="sw" style="background:${sg.color}"></span>${esc(sg.name)} · ${sg.detail} → <b>${Math.round(sg.pts)}</b>`).join('') + `<br>Total <b>${Math.round(d.total)}</b> pts`
        : '<br>Nothing logged');
      tip.style.display = 'block';
      const half = tip.offsetWidth / 2;
      tip.style.left = Math.min(Math.max(px, half), W - half) + 'px';
    }
    function hide() { hot.setAttribute('visibility', 'hidden'); tip.style.display = 'none'; }
    svg.addEventListener('pointerdown', e => show(e.clientX));
    svg.addEventListener('pointermove', e => show(e.clientX));
    svg.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hide(); });
    hideTip = hide;
  }

  const cal = document.getElementById('cal');
  let calMonth; // YYYY-MM-01 of the month on show
  function renderCal() {
    const first = dateOf(calMonth), t = todayStr(), logged = new Set(armDates());
    document.getElementById('calTitle').textContent = first.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    document.getElementById('calNext').disabled = calMonth >= t.slice(0, 8) + '01';
    const lead = (first.getDay() + 6) % 7; // weeks start on Monday
    const dim = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
    const wds = [...Array(7)].map((_, i) => `<div class="wd">${new Date(2024, 0, 1 + i).toLocaleDateString(undefined, { weekday: 'narrow' })}</div>`).join('');
    const cells = [...Array(lead)].map(() => '<div></div>').join('') + [...Array(dim)].map((_, i) => {
      const d = calMonth.slice(0, 8) + pad(i + 1);
      return `<button data-day="${d}" class="${d === ui.day ? 'sel' : ''}${d === t ? ' today' : ''}" ${d > t ? 'disabled' : ''}>${i + 1}${logged.has(d) ? '<i></i>' : ''}</button>`;
    }).join('');
    document.getElementById('calGrid').innerHTML = wds + cells;
  }
  function openCal() { calMonth = ui.day.slice(0, 8) + '01'; renderCal(); cal.hidden = false; }
  function pickDay(d) { cal.hidden = true; ui.day = d; render(); }
  cal.addEventListener('click', e => {
    const b = e.target.closest('[data-cal], [data-day]');
    if (!b || b.disabled) return;
    if (b.dataset.day) return pickDay(b.dataset.day);
    const act = b.dataset.cal;
    if (act === 'close') cal.hidden = true;
    else if (act === 'today') pickDay(todayStr());
    else { const d = dateOf(calMonth); d.setMonth(d.getMonth() + (act === 'next' ? 1 : -1)); calMonth = shiftDay(`${d.getFullYear()}-${pad(d.getMonth() + 1)}-01`, 0); renderCal(); }
  });

  let hideTip = null;
  document.addEventListener('pointerdown', e => { if (hideTip && !e.target.closest('.chart')) hideTip(); });

  // ---------- routing ----------
  function currentEx() {
    const m = location.hash.match(/^#\/ex\/(.+)$/);
    return m ? findEx(m[1]) : null;
  }
  let lastRoute = null;
  // Routes: start page (#/), Arms today (#/arms), Arms progress (#/arms/progress), #/ex/<id>, #/guitar
  function render() {
    const ex = currentEx(), h = location.hash;
    const route = ex ? ex.id : h;
    if (route !== lastRoute) {
      if (ex) ui.tab = 'iso';
      window.scrollTo(0, 0);
      lastRoute = route;
    }
    document.body.classList.toggle('has-tabbar', h === '#/arms' || h === '#/arms/progress');
    if (ex) renderExercise(ex);
    else if (h === '#/guitar') renderGuitar();
    else if (h === '#/arms') renderArms();
    else if (h === '#/arms/progress') renderArmsProgress();
    else renderChooser();
  }
  function commit() { save(); render(); }

  // ---------- events ----------
  app.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const act = b.dataset.act;
    const ex = b.dataset.id ? findEx(b.dataset.id) : currentEx();

    switch (act) {
      case 'tick': toggleDone(ex, b.dataset.kind); break;
      case 'tick-guitar': toggleGuitar(); break;
      case 'day': { const d = shiftDay(ui.day, +b.dataset.d); if (d <= todayStr()) ui.day = d; return render(); }
      case 'cal': return openCal();
      case 'goto': ui.day = b.dataset.date; location.hash = '#/arms'; return;
      case 'g-min': { const t = guitarDay(); if (t) t.minutes = Math.max(5, (t.minutes || 0) + +b.dataset.d); break; }
      case 'g-del':
        if (!confirm(`Delete the guitar session from ${fmtDate(b.dataset.date)}?`)) return;
        state.guitar.history = state.guitar.history.filter(h => h.date !== b.dataset.date);
        break;
      case 'range':
        ui.range = +b.dataset.r;
        try { localStorage.setItem(KEY + '.range', ui.range); } catch (err) { /* not remembered */ }
        return render();
      case 'week': state.cycle[+b.dataset.i].done = !state.cycle[+b.dataset.i].done; break;
      case 'new-cycle': state.cycle.forEach(w => { w.done = false; }); break;
      case 'tab': ui.tab = b.dataset.kind; return render();
      case 'metric': ui.metric[ui.tab] = b.dataset.m; return render();
      case 'feel': setFeel(ex, ui.tab, +b.dataset.v); break;
      case 'unit': setConfig(ex, ui.tab, 'unit', b.dataset.u); break;
      case 'del-hist': {
        if (!confirm(`Delete the entry from ${fmtDate(b.dataset.date)}?`)) return;
        const sec = ex[ui.tab];
        sec.history = sec.history.filter(h => h.date !== b.dataset.date);
        break;
      }
      case 'delete-ex':
        if (!confirm(`Delete ${ex.name} and all its history?`)) return;
        state.exercises = state.exercises.filter(x => x !== ex);
        save(); location.hash = '#/arms'; return;
      case 'add': {
        const name = (prompt('Exercise name') || '').trim();
        if (!name) return;
        const nx = {
          id: uid(), name, assisted: false,
          iso: section(null, 'kg', 30, 'iso', '', '', 0, null),
          dyn: section(null, 'kg', 5, 'dyn', '', '', 0, null),
        };
        state.exercises.push(nx);
        save(); location.hash = '#/ex/' + nx.id; return;
      }
      case 'export': return exportData();
      case 'import': return document.getElementById('importFile').click();
      default: return;
    }
    commit();
  });

  app.addEventListener('change', e => {
    const t = e.target, ex = currentEx();
    if (t.id === 'f-body') {
      const v = parseNum(t.value);
      state.bodyKg = v != null && v > 0 ? v : null;
      return commit();
    }
    if (t.id === 'g-minutes') {
      const v = parseNum(t.value);
      if (v != null && v > 0) state.guitar.minutes = v;
      return commit();
    }
    if (!ex) return;
    if (t.id === 'f-name') { ex.name = t.value.trim() || ex.name; return commit(); }
    if (t.id === 'f-assisted') { ex.assisted = t.checked; return commit(); }
    const field = t.dataset.field;
    if (!field) return;
    if (field === 'setting') { setConfig(ex, ui.tab, 'setting', t.value.trim()); return commit(); }
    setConfig(ex, ui.tab, field, parseNum(t.value));
    commit();
  });

  app.addEventListener('input', e => {
    if (e.target.id !== 'f-aims') return;
    const ex = currentEx();
    if (ex) { ex[ui.tab].aims = e.target.value; save(); }
  });

  // Enter on a number field closes the keyboard (which commits via "change").
  app.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') e.target.blur(); });

  // ---------- backup ----------
  async function exportData() {
    const name = `workouts-${todayStr()}.json`;
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'Workouts backup' }); return; }
      catch (err) { if (err.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  document.getElementById('importFile').addEventListener('change', async e => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      if (!d || !Array.isArray(d.exercises) || !Array.isArray(d.cycle)) throw new Error('bad file');
      if (!confirm('Replace all current data with this backup?')) return;
      state = migrate(d); save(); location.hash = '#/arms'; render();
    } catch (err) {
      alert('That file doesn’t look like a workouts backup.');
    }
  });

  window.addEventListener('hashchange', render);
  let rw = window.innerWidth;
  window.addEventListener('resize', () => { if (window.innerWidth !== rw) { rw = window.innerWidth; render(); } });
  // Re-render when the app comes back to the foreground on a new day, so "today" ticks reset.
  let shownDay = todayStr();
  function checkNewDay() {
    if (!document.hidden && todayStr() !== shownDay) {
      if (ui.day === shownDay) ui.day = todayStr(); // follow "today" overnight unless another day was picked
      shownDay = todayStr(); render();
    }
  }
  document.addEventListener('visibilitychange', checkNewDay);
  window.addEventListener('pageshow', checkNewDay);
  window.addEventListener('focus', checkNewDay);
  setInterval(checkNewDay, 60 * 1000);

  render();

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
